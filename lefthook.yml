pre-push:
  commands:
    test:
      glob: "*.go"
      run: task test

pre-commit:
  parallel: true
  commands:
    lint:
      files: git diff --name-only --cached
      glob: "*.go"
      run: golangci-lint run --fix {files}

commit-msg:
  scripts:
    "commitlint.sh":
      runner: bash
