# Golang CI configuration file
# Check https://golangci-lint.run/docs/configuration/file/
version: "2"
run:
  timeout: 5m

linters:
  default: standard
  settings:
    gocyclo:
      min-complexity: 20

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/brpaz/go-test-html-report)
        - blank
        - dot
        - alias
        - localmodule
