# https://taskfile.dev

version: "3"

vars:
  REPORTS_DIR: "reports"

tasks:
  default:
    cmds:
      - task -l

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  lint-fix:
    desc: Run linter with fix
    cmds:
      - golangci-lint run --fix

  test:
    desc: Run unit tests
    cmds:
      - |
        mkdir -p {{ .REPORTS_DIR }}
        gotestsum --format testname --jsonfile reports/test-result.json \
            --  -coverprofile={{ .REPORTS_DIR }}/coverage.out -covermode=atomic ./internal/...

  test-with-report:
    desc: Run unit tests and generate HTML report
    cmds:
      - mkdir -p {{ .REPORTS_DIR }}
      - go test -json ./internal/... | go run cmd/main.go -i - -o {{ .REPORTS_DIR }}/test-report.html -t "Test Report"

  snapshot:
    desc: Create a snapshot release
    cmds:
      - goreleaser release --snapshot --clean

  nix-build:
    desc: Build the CLI via the Nix flake
    cmds:
      - nix build .#default
